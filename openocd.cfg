# OpenOCD config - STM32G431RBT6
# Debugger: ST-LINK DAP (V2/V2-1/V3)
# Auto-generated by gen_openocd_cfg.py

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

set ENABLE_LOW_POWER 1
source [find target/stm32g4x.cfg]

# Use Cortex-M SYSRESETREQ so flashing also works without an NRST wire.
reset_config none
adapter speed 4000
